name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

env:
  PITCHCREW_SEED_SKILLS: '0'
  PITCHCREW_POSTHOG_DISABLED: '1'
  NEXT_PUBLIC_POSTHOG_TOKEN: ''

jobs:
  quality:
    name: Lint, format, types and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      installers_required: >-
        ${{ github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'pull_request' && github.base_ref == 'main') ||
            (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Cache Bun packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock', '.bun-version') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Check formatting
        run: bun run format:check
      - name: Check types
        run: bun run typecheck
      - name: Build browser and Electron bundles
        run: bun run build
      - name: Build public landing page
        run: bun run landing:build

  tests:
    name: Tests (Node ${{ matrix.node }}, shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        shard: [1, 2]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Cache Bun packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock', '.bun-version') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: bun run browser:install --with-deps
      - name: Run unit, HTTP, adapter, MCP and browser tests
        run: bun run test --shard=${{ matrix.shard }}/2 --maxWorkers=2 --reporter=default --reporter=junit --outputFile.junit=test-results/vitest.xml
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: test-results-node-${{ matrix.node }}-shard-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  bun-runtime:
    name: Bun runtime integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Cache Bun packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock', '.bun-version') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify the Bun daemon, MCP and bounded helpers
        run: bun run test:bun

  desktop:
    name: Electron smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Cache Bun packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock', '.bun-version') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build and verify the actual Electron renderer
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: bun run test:desktop
      - name: Upload desktop evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: desktop-evidence-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/pitchcrew-electron-check-*/result.json
            ${{ runner.temp }}/pitchcrew-electron-check-*/result.json.png
          if-no-files-found: ignore
          retention-days: 7

  installers:
    name: Packaged app (${{ matrix.os }})
    needs: quality
    if: ${{ needs.quality.outputs.installers_required == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2025]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Cache Bun packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock', '.bun-version') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-
      - run: bun install --frozen-lockfile
      - name: Build installers
        run: bun run desktop:package
      - name: Verify Windows installer process handling
        if: runner.os == 'Windows'
        run: bun run test:installer
      - name: Verify packaged app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root dist/releases/linux-unpacked/chrome-sandbox
          sudo chmod 4755 dist/releases/linux-unpacked/chrome-sandbox
          xvfb-run -a bun run test:packaged
      - name: Verify packaged app (Windows and macOS)
        if: runner.os != 'Linux'
        run: bun run test:packaged
      - name: Upload installers
        id: upload-installers
        continue-on-error: true
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/releases/*.exe
            dist/releases/*.dmg
            dist/releases/*.AppImage
            dist/releases/*.deb
            dist/releases/*.zip
            dist/releases/*.yml
            dist/releases/*.blockmap
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Wait before retrying installer upload
        if: ${{ !cancelled() && steps.upload-installers.outcome == 'failure' }}
        shell: bash
        run: sleep 30
      - name: Retry installer upload
        if: ${{ !cancelled() && steps.upload-installers.outcome == 'failure' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/releases/*.exe
            dist/releases/*.dmg
            dist/releases/*.AppImage
            dist/releases/*.deb
            dist/releases/*.zip
            dist/releases/*.yml
            dist/releases/*.blockmap
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  ci:
    name: CI
    if: ${{ always() }}
    needs: [quality, tests, bun-runtime, desktop, installers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          BUN_RUNTIME_RESULT: ${{ needs.bun-runtime.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          INSTALLERS_REQUIRED: ${{ needs.quality.outputs.installers_required }}
          INSTALLERS_RESULT: ${{ needs.installers.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TESTS_RESULT" = success
          test "$BUN_RUNTIME_RESULT" = success
          test "$DESKTOP_RESULT" = success
          case "$INSTALLERS_REQUIRED:$INSTALLERS_RESULT" in
            true:success|false:skipped) ;;
            *) echo "Installer verification did not match the required CI policy." >&2; exit 1 ;;
          esac
